name: ATLAS mobile and desktop visual smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production Angular with inlined CSS
        run: npm run build
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run iPhone and desktop Chromium visual checks
        run: node scripts/visual-smoke.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-visual-screenshots
          path: test-artifacts/
          retention-days: 7
